name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 1. Линтеры и тесты
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Зависимости бэкенда
        run: pip install -r backend/requirements/dev.txt
      - name: Линтер ruff
        working-directory: backend
        run: ruff check .
      - name: Тесты pytest
        working-directory: backend
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Сборка фронтенда
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

  # 2. Сборка образов и публикация в приватный GHCR (на pull request только сборка, без публикации)
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: backend, file: backend/Dockerfile, target: api }
          - { name: auth, context: backend, file: backend/Dockerfile, target: auth }
          - { name: worker, context: backend, file: backend/Dockerfile, target: worker }
          - { name: gateway, context: ., file: gateway/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Имя владельца строчными буквами
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Короткий sha
        run: echo "SHA7=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/lic-${{ matrix.name }}:${{ env.SHA7 }}
            ghcr.io/${{ env.OWNER }}/lic-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 3. Smoke-тест: поднимаем compose-стек и проверяем доступность
  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Тестовый .env (одноразовые значения, не секреты)
        run: |
          cat > .env <<'ENVEOF'
          GATEWAY_PORT=8080
          POSTGRES_DB=licenses
          POSTGRES_USER=licenses
          POSTGRES_PASSWORD=ci_db_password
          JWT_SECRET=ci_jwt_secret_ci_jwt_secret_ci_jwt_secret
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=ci_admin_password
          VIEWER_PASSWORD=ci_viewer_password
          REDIS_ENABLED=true
          GRAFANA_ADMIN_PASSWORD=ci_grafana_password
          ENVEOF
          sed -i 's/^ *//' .env
      - name: Сборка и запуск
        run: docker compose up -d --build
      - name: Ждём готовности gateway и api
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then echo "готово через $((i*5)) сек"; exit 0; fi
            sleep 5
          done
          echo "Сервисы не поднялись"; exit 1
      - name: Проверки
        run: |
          set -e
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/auth/health
          curl -fsS http://localhost:8080/ | grep -q "Учёт лицензий"
          docker compose exec -T api python -m api.seed
          TOKEN=$(curl -fsS -X POST http://localhost:8080/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci_admin_password"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS http://localhost:8080/api/dashboard -H "Authorization: Bearer $TOKEN" | grep -q seats_total
          # без токена api должен отвечать 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/software)" = "401"
          # postgres не должен быть опубликован наружу
          test -z "$(docker compose port postgres 5432 2>/dev/null)"
          # метрики api видит Prometheus
          docker compose exec -T prometheus wget -qO- 'http://localhost:9090/api/v1/targets' | grep -q '"health":"up"'
      - name: Логи при ошибке
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=80
      - name: Остановка и удаление
        if: always()
        run: docker compose down -v

  # 4. Деплой на VPS по SSH (только main и только после успешных сборки и smoke-теста)
  deploy:
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-vps, cancel-in-progress: false }
    env:
      SSH_OPTS: -i ~/.ssh/deploy_key -p ${{ secrets.VPS_SSH_PORT || 22 }} -o BatchMode=yes -o StrictHostKeyChecking=yes
      TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Настройка SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Копируем файлы стека на сервер
        run: |
          tar czf - swarm scripts monitoring gateway/monitoring-proxy.conf \
            | ssh $SSH_OPTS "$TARGET" 'mkdir -p ~/licenses && tar xzf - -C ~/licenses'
      - name: docker login в GHCR на сервере (токен только на чтение)
        env:
          GHCR_USER: ${{ secrets.GHCR_READ_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh $SSH_OPTS "$TARGET" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Деплой стека
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          TAG="${GITHUB_SHA::7}"
          PORT="${{ vars.VPS_GATEWAY_PORT || '8088' }}"
          ssh $SSH_OPTS "$TARGET" \
            "cd ~/licenses && REGISTRY=ghcr.io/$OWNER TAG=$TAG GATEWAY_PORT=$PORT sh ./scripts/deploy.sh"
      - name: Чистка старых образов на сервере
        if: success()
        run: ssh $SSH_OPTS "$TARGET" 'docker image prune -f >/dev/null'
      - name: Подсказка по откату
        if: failure()
        run: echo "Деплой не прошёл. Откат описан в docs/CICD.md (scripts/rollback.sh)."
