# StatefulSet нужен для баз данных: у пода стабильное имя и свой диск (PVC), который переживает перезапуск.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None          # headless: имя postgres указывает прямо на под
  selector: { app: postgres }
  ports:
    - { port: 5432, name: pg }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      securityContext: { fsGroup: 70 }     # пользователь postgres в alpine-образе
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["-c", "shared_buffers=32MB", "-c", "max_connections=40"]
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME } } }
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: app-config, key: DB_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: DB_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { memory: 96Mi, cpu: 50m }
            limits: { memory: 256Mi, cpu: 500m }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
