# Grafana и Prometheus через gateway.
# Адрес берётся через переменную, поэтому nginx стартует, даже если этих контейнеров нет.
location /grafana/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $grafana http://grafana:3000;
    proxy_pass $grafana;
    proxy_set_header Host $host;
}

location /prometheus/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $prometheus http://prometheus:9090;
    rewrite ^/prometheus/(.*)$ /$1 break;
    proxy_pass $prometheus;
    proxy_set_header Host $host;
}
